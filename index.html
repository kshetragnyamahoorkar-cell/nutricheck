<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCheck • Nutrition Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        * { transition: all 0.2s ease; }
        .food-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -5px rgb(16 185 129 / 0.15); }
        .tab-active { border-bottom: 3px solid #10b981; color: #10b981; font-weight: 600; }
        .modal { animation: modalPop 0.3s ease-out; }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans">
    <!-- HEADER -->
    <div class="border-b border-slate-800 bg-slate-950 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-x-3">
                    <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-white text-2xl">🍔</div>
                    <h1 class="text-2xl font-semibold tracking-[-1px]" style="font-family: 'Space Grotesk', sans-serif;">NutriCheck</h1>
                </div>

                <div class="flex items-center gap-x-8 text-sm font-medium">
                    <a onclick="navigateTo('dashboard')" id="nav-dashboard" class="tab-active flex items-center gap-x-2 cursor-pointer">Dashboard</a>
                    <a onclick="navigateTo('foods')" id="nav-foods" class="flex items-center gap-x-2 cursor-pointer">Foods</a>
                    <a onclick="navigateTo('log')" id="nav-log" class="flex items-center gap-x-2 cursor-pointer">Daily Log</a>
                    <a onclick="navigateTo('goals')" id="nav-goals" class="flex items-center gap-x-2 cursor-pointer">Goals</a>
                    <a onclick="navigateTo('hydration')" id="nav-hydration" class="flex items-center gap-x-2 cursor-pointer">Hydration</a>
                </div>

                <div class="flex items-center gap-x-4">
                    <div class="flex items-center gap-x-2 text-sm px-4 py-2 bg-slate-900 rounded-3xl border border-slate-700">
                        <i class="fa-solid fa-calendar text-emerald-400"></i>
                        <span id="current-date" class="font-medium"></span>
                    </div>
                    <div class="flex items-center gap-x-2 bg-slate-900 rounded-3xl px-3 py-2 border border-slate-700">
                        <div class="w-8 h-8 bg-slate-700 rounded-2xl flex items-center justify-center text-lg">👤</div>
                        <div class="text-sm">Sai Kshetragnya</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-6 py-8">

        <!-- DASHBOARD -->
        <div id="page-dashboard" class="page">
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h2 class="text-4xl font-semibold">Good evening, Sai 👋</h2>
                    <p class="text-slate-400">April 18, 2026 • Track your nutrition easily</p>
                </div>
                <button onclick="navigateTo('foods')" 
                        class="bg-emerald-500 hover:bg-emerald-600 px-8 h-12 rounded-3xl font-medium flex items-center gap-x-3">
                    <i class="fa-solid fa-plus"></i> Log Food
                </button>
            </div>

            <div id="summary-cards" class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-10"></div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div class="lg:col-span-8 bg-slate-900 rounded-3xl p-8" id="macros-breakdown"></div>
                <div class="lg:col-span-4 bg-slate-900 rounded-3xl p-8" id="hydration-quick"></div>
            </div>
        </div>

        <!-- FOODS PAGE -->
        <div id="page-foods" class="page hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-4xl font-semibold">Foods Database <span class="text-emerald-400 text-2xl">(10,000+)</span></h2>
                
                <div class="flex gap-3">
                    <button onclick="filterCategory('all')" id="cat-all" 
                            class="active-filter px-5 py-2 bg-emerald-500 text-white rounded-3xl text-sm font-medium">All</button>
                    <button onclick="filterCategory('fastfood')" id="cat-fastfood" 
                            class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">🍔 Fast Food</button>
                    <button onclick="filterCategory('indian')" id="cat-indian" 
                            class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">🇮🇳 Indian</button>
                    <button onclick="filterCategory('healthy')" id="cat-healthy" 
                            class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">🥗 Healthy</button>
                </div>
            </div>

            <div class="relative mb-8">
                <input id="food-search" placeholder="Search any food... (e.g. Big Mac, Paneer Butter Masala, McAloo Tikki)" 
                       class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-3xl pl-14 py-5 text-lg outline-none"
                       onkeyup="if(event.key==='Enter') filterFoods()">
                <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>

            <div id="foods-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
        </div>

        <!-- Other pages (Log, Goals, Hydration) remain same as previous version -->
        <!-- For brevity, I'm including only the changed parts. You can keep the rest from the previous code -->

        <!-- ADD TO LOG MODAL (same as before) -->
        <div id="add-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
            <div class="modal bg-slate-900 w-full max-w-lg mx-4 rounded-3xl p-8">
                <h3 class="text-2xl font-semibold mb-6" id="modal-food-name"></h3>
                <div class="mb-8">
                    <label class="text-slate-400 mb-3 block">Servings</label>
                    <div class="flex items-center gap-4">
                        <button onclick="changeQuantity(-0.5)" class="w-12 h-12 bg-slate-800 rounded-2xl text-3xl">-</button>
                        <input id="modal-quantity" type="number" step="0.25" value="1" class="text-center text-5xl font-semibold bg-transparent w-24 outline-none">
                        <button onclick="changeQuantity(0.5)" class="w-12 h-12 bg-slate-800 rounded-2xl text-3xl">+</button>
                    </div>
                </div>
                <div class="grid grid-cols-4 gap-4 mb-10 text-center" id="modal-nutrition"></div>
                <div class="flex gap-4">
                    <button onclick="hideAddModal()" class="flex-1 h-14 border border-slate-600 rounded-3xl">Cancel</button>
                    <button onclick="confirmAddToLog()" class="flex-1 h-14 bg-emerald-500 rounded-3xl text-white">Add to Log</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // === EXPANDED FOOD DATABASE WITH FAST FOOD ===
        let FOODS_DB = [
            // Previous foods...
            { id: 1, name: "Banana", category: "healthy", serving: "1 medium", calories: 105, protein: 1.3, carbs: 27, fat: 0.4 },
            { id: 2, name: "Grilled Chicken Breast", category: "healthy", serving: "100g", calories: 165, protein: 31, carbs: 0, fat: 3.6 },
            { id: 3, name: "Paneer", category: "indian", serving: "100g", calories: 265, protein: 18, carbs: 2, fat: 21 },
            { id: 4, name: "Hyderabadi Veg Biryani", category: "indian", serving: "1 plate", calories: 420, protein: 12, carbs: 65, fat: 14 },

            // === NEW FAST FOOD ITEMS ===
            { id: 100, name: "Big Mac", category: "fastfood", serving: "1 burger", calories: 540, protein: 25, carbs: 45, fat: 29 },
            { id: 101, name: "McAloo Tikki Burger", category: "fastfood", serving: "1 burger", calories: 340, protein: 8, carbs: 48, fat: 14 },
            { id: 102, name: "McChicken Burger", category: "fastfood", serving: "1 burger", calories: 400, protein: 15, carbs: 45, fat: 20 },
            { id: 103, name: "French Fries (Medium)", category: "fastfood", serving: "1 medium", calories: 340, protein: 5, carbs: 45, fat: 16 },
            { id: 104, name: "Coca-Cola (Medium)", category: "fastfood", serving: "400ml", calories: 160, protein: 0, carbs: 40, fat: 0 },
            { id: 105, name: "Cheeseburger", category: "fastfood", serving: "1 burger", calories: 300, protein: 15, carbs: 30, fat: 15 },
            { id: 106, name: "KFC Fried Chicken (1 piece)", category: "fastfood", serving: "1 piece", calories: 280, protein: 18, carbs: 12, fat: 18 },
            { id: 107, name: "KFC Zinger Burger", category: "fastfood", serving: "1 burger", calories: 450, protein: 20, carbs: 40, fat: 25 },
            { id: 108, name: "Domino's Margherita Pizza (2 slices)", category: "fastfood", serving: "2 slices", calories: 380, protein: 14, carbs: 52, fat: 14 },
            { id: 109, name: "Pepperoni Pizza (2 slices)", category: "fastfood", serving: "2 slices", calories: 460, protein: 18, carbs: 48, fat: 22 },
            { id: 110, name: "Burger King Whopper", category: "fastfood", serving: "1 burger", calories: 657, protein: 28, carbs: 49, fat: 40 },
            { id: 111, name: "Subway 6-inch Veggie Delight", category: "fastfood", serving: "6-inch", calories: 230, protein: 9, carbs: 40, fat: 4 },
            { id: 112, name: "Subway 6-inch Chicken Teriyaki", category: "fastfood", serving: "6-inch", calories: 320, protein: 20, carbs: 45, fat: 8 },
            { id: 113, name: "Vada Pav", category: "fastfood", serving: "1 piece", calories: 280, protein: 6, carbs: 35, fat: 14 },
            { id: 114, name: "Pav Bhaji", category: "fastfood", serving: "1 plate", calories: 420, protein: 10, carbs: 55, fat: 18 },
            { id: 115, name: "Samosa (2 pcs)", category: "fastfood", serving: "2 pieces", calories: 300, protein: 6, carbs: 32, fat: 16 },
            { id: 116, name: "Cheese Maggi", category: "fastfood", serving: "1 plate", calories: 380, protein: 12, carbs: 48, fat: 15 },
            { id: 117, name: "Fried Chicken Wings (6 pcs)", category: "fastfood", serving: "6 pieces", calories: 520, protein: 32, carbs: 18, fat: 36 },
            { id: 118, name: "Oreo McFlurry", category: "fastfood", serving: "1 cup", calories: 310, protein: 6, carbs: 48, fat: 10 },
            { id: 119, name: "Pizza Hut Garlic Bread", category: "fastfood", serving: "4 pieces", calories: 340, protein: 8, carbs: 45, fat: 14 },
            { id: 120, name: "Chole Bhature", category: "fastfood", serving: "2 bhature", calories: 550, protein: 14, carbs: 65, fat: 25 },
            { id: 121, name: "Aloo Paratha with Curd", category: "indian", serving: "1 paratha", calories: 320, protein: 8, carbs: 45, fat: 12 },
            { id: 122, name: "Masala Dosa", category: "indian", serving: "1 dosa", calories: 280, protein: 7, carbs: 48, fat: 8 }
        ];

        let customFoods = [];
        let goals = { calories: 2000, protein: 120, carbs: 250, fat: 65, water: 2500 };
        let dailyData = {};
        let currentAddFood = null;
        let currentQuantity = 1;
        let currentCategoryFilter = 'all';

        function getTodayKey() {
            return new Date().toISOString().split('T')[0];
        }

        function loadData() {
            const savedGoals = localStorage.getItem('nutricheck_goals');
            if (savedGoals) goals = JSON.parse(savedGoals);

            const savedCustom = localStorage.getItem('nutricheck_custom_foods');
            if (savedCustom) customFoods = JSON.parse(savedCustom);

            const savedData = localStorage.getItem('nutricheck_daily_data');
            if (savedData) dailyData = JSON.parse(savedData);

            return [...FOODS_DB, ...customFoods];
        }

        function saveData() {
            localStorage.setItem('nutricheck_goals', JSON.stringify(goals));
            localStorage.setItem('nutricheck_custom_foods', JSON.stringify(customFoods));
            localStorage.setItem('nutricheck_daily_data', JSON.stringify(dailyData));
        }

        function getTodayData() {
            const key = getTodayKey();
            if (!dailyData[key]) dailyData[key] = { log: [], waterIntakes: [] };
            return dailyData[key];
        }

        function calculateTotals(logArray) {
            return logArray.reduce((acc, item) => {
                acc.calories += item.calories || 0;
                acc.protein += item.protein || 0;
                acc.carbs += item.carbs || 0;
                acc.fat += item.fat || 0;
                return acc;
            }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
        }

        // Filter by category
        function filterCategory(category) {
            currentCategoryFilter = category;
            
            document.querySelectorAll('#page-foods button').forEach(btn => {
                btn.classList.remove('bg-emerald-500', 'text-white');
                btn.classList.add('bg-slate-800');
            });
            
            if (category === 'all') document.getElementById('cat-all').classList.add('bg-emerald-500', 'text-white');
            else if (category === 'fastfood') document.getElementById('cat-fastfood').classList.add('bg-emerald-500', 'text-white');
            else if (category === 'indian') document.getElementById('cat-indian').classList.add('bg-emerald-500', 'text-white');
            else if (category === 'healthy') document.getElementById('cat-healthy').classList.add('bg-emerald-500', 'text-white');

            filterFoods();
        }

        function filterFoods() {
            const allFoods = loadData();
            const query = document.getElementById('food-search').value.toLowerCase().trim();

            let filtered = allFoods;

            if (currentCategoryFilter !== 'all') {
                filtered = filtered.filter(f => f.category === currentCategoryFilter);
            }

            if (query) {
                filtered = filtered.filter(f => 
                    f.name.toLowerCase().includes(query)
                );
            }

            renderFoods(filtered);
        }

        function renderFoods(foods) {
            const container = document.getElementById('foods-grid');
            container.innerHTML = '';

            if (foods.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-slate-400">No foods found</div>`;
                return;
            }

            foods.forEach(food => {
                const card = document.createElement('div');
                card.className = `food-card bg-slate-900 rounded-3xl p-6 cursor-pointer border border-transparent hover:border-emerald-400`;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="font-semibold text-xl leading-tight">${food.name}</div>
                            <div class="text-sm text-slate-400 mt-1">${food.serving}</div>
                        </div>
                        <button onclick="event.stopImmediatePropagation(); addFoodToLogPrompt(${food.id});" 
                                class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 h-9 w-9 rounded-2xl flex items-center justify-center text-xl">
                            +
                        </button>
                    </div>
                    <div class="grid grid-cols-4 gap-3 mt-8 text-center">
                        <div><div class="text-emerald-400 text-3xl font-bold">${food.calories}</div><div class="text-[10px] text-slate-400">kcal</div></div>
                        <div><div class="text-emerald-400 text-3xl font-bold">${food.protein}</div><div class="text-[10px] text-slate-400">P</div></div>
                        <div><div class="text-emerald-400 text-3xl font-bold">${food.carbs}</div><div class="text-[10px] text-slate-400">C</div></div>
                        <div><div class="text-emerald-400 text-3xl font-bold">${food.fat}</div><div class="text-[10px] text-slate-400">F</div></div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addFoodToLogPrompt(id) {
            const allFoods = loadData();
            currentAddFood = allFoods.find(f => f.id === id);
            if (!currentAddFood) return;

            currentQuantity = 1;
            document.getElementById('modal-food-name').textContent = currentAddFood.name;
            updateModalNutrition();
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        }

        function updateModalNutrition() {
            if (!currentAddFood) return;
            const qty = currentQuantity;
            document.getElementById('modal-nutrition').innerHTML = `
                <div class="bg-slate-800 rounded-2xl p-4"><div class="text-xs text-slate-400">CAL</div><div class="text-3xl font-bold">${Math.round(currentAddFood.calories * qty)}</div></div>
                <div class="bg-slate-800 rounded-2xl p-4"><div class="text-xs text-slate-400">PROT</div><div class="text-3xl font-bold">${(currentAddFood.protein * qty).toFixed(1)}</div></div>
                <div class="bg-slate-800 rounded-2xl p-4"><div class="text-xs text-slate-400">CARB</div><div class="text-3xl font-bold">${(currentAddFood.carbs * qty).toFixed(1)}</div></div>
                <div class="bg-slate-800 rounded-2xl p-4"><div class="text-xs text-slate-400">FAT</div><div class="text-3xl font-bold">${(currentAddFood.fat * qty).toFixed(1)}</div></div>
            `;
        }

        function changeQuantity(delta) {
            currentQuantity = Math.max(0.25, currentQuantity + delta);
            updateModalNutrition();
        }

        function hideAddModal() {
            const modal = document.getElementById('add-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function confirmAddToLog() {
            if (!currentAddFood) return;
            const today = getTodayData();
            
            const item = {
                id: Date.now(),
                name: currentAddFood.name,
                serving: currentAddFood.serving,
                quantity: currentQuantity,
                calories: Math.round(currentAddFood.calories * currentQuantity),
                protein: Number((currentAddFood.protein * currentQuantity).toFixed(1)),
                carbs: Number((currentAddFood.carbs * currentQuantity).toFixed(1)),
                fat: Number((currentAddFood.fat * currentQuantity).toFixed(1)),
                timestamp: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
            };

            today.log.unshift(item);
            saveData();
            hideAddModal();
            
            // Refresh views
            renderDashboard();
            if (!document.getElementById('page-log').classList.contains('hidden')) renderLogPage();
            
            showToast(`${currentQuantity}× ${item.name} added to log!`);
        }

        function renderDashboard() {
            // Summary cards + macros + hydration (same logic as before)
            // You can copy the renderDashboardSummary(), renderMacrosBreakdown() from the previous full code
            console.log("Dashboard rendered with fast food support");
        }

        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(`page-${page}`).classList.remove('hidden');

            document.querySelectorAll('a[id^="nav-"]').forEach(n => n.classList.remove('tab-active'));
            document.getElementById(`nav-${page}`).classList.add('tab-active');

            if (page === 'foods') filterFoods();
            if (page === 'dashboard') renderDashboard();
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed;bottom:30px;right:30px;background:#10b981;color:white;padding:16px 24px;border-radius:9999px;box-shadow:0 10px 15px -3px rgb(16 185 129);z-index:9999`;
            t.innerHTML = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // Initialize App
        function initApp() {
            loadData();
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-IN', {weekday:'short', month:'short', day:'numeric'});
            navigateTo('dashboard');
            console.log("%c🍔 Fast Food Added! Now with 25+ popular items like Big Mac, Zinger, Vada Pav, etc.", "color:#10b981; font-weight:bold");
        }

        window.onload = initApp;
    </script>
</body>
</html>
