<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack • Sai's Fitness</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .nav-active { background-color: rgb(59 130 246); color: white; }
    .progress-bar { transition: width 0.4s ease; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div class="max-w-7xl mx-auto flex h-screen">
    <!-- Sidebar -->
    <div class="w-64 bg-gray-900 border-r border-gray-800 p-4 flex flex-col">
      <div class="flex items-center gap-3 mb-8 px-2">
        <i class="fas fa-dumbbell text-blue-500 text-3xl"></i>
        <h1 class="text-2xl font-bold">FitTrack</h1>
      </div>
      
      <nav class="space-y-1 flex-1">
        <button onclick="showPage('dashboard')" class="nav-active w-full text-left px-4 py-3 rounded-xl flex items-center gap-3">
          <i class="fas fa-home"></i> Dashboard
        </button>
        <button onclick="showPage('log')" class="w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 hover:bg-gray-800">
          <i class="fas fa-plus"></i> Log Workout
        </button>
        <button onclick="showPage('history')" class="w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 hover:bg-gray-800">
          <i class="fas fa-history"></i> History
        </button>
        <button onclick="showPage('goals')" class="w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 hover:bg-gray-800">
          <i class="fas fa-target"></i> Goals
        </button>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 overflow-auto">

      <!-- Dashboard -->
      <div id="dashboard" class="page p-8"> ... (same as before) </div>

      <!-- Log Workout -->
      <div id="log" class="page hidden p-8"> ... (same as before) </div>

      <!-- History -->
      <div id="history" class="page hidden p-8"> ... (same as before) </div>

      <!-- ==================== GOALS PAGE ==================== -->
      <div id="goals" class="page hidden p-8">
        <div class="flex justify-between items-center mb-8">
          <h1 class="text-4xl font-bold">Your Goals</h1>
          <button onclick="showAddGoalModal()" 
                  class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-2xl flex items-center gap-2">
            <i class="fas fa-plus"></i> New Goal
          </button>
        </div>

        <div id="goals-list" class="space-y-6"></div>

        <!-- Empty State -->
        <div id="empty-goals" class="hidden text-center py-20">
          <i class="fas fa-target text-6xl text-gray-700 mb-4"></i>
          <p class="text-xl text-gray-400">No goals set yet</p>
          <p class="text-gray-500 mt-2">Create your first goal to stay motivated!</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Goal Modal -->
  <div id="goal-modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-3xl p-8 w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6">Create New Goal</h2>
      
      <input id="goal-name" type="text" placeholder="Goal name (e.g. Bench Press 100kg)" 
             class="w-full bg-gray-800 rounded-2xl px-6 py-4 mb-4 outline-none">

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm text-gray-400">Target</label>
          <input id="goal-target" type="number" value="100" 
                 class="w-full bg-gray-800 rounded-2xl px-6 py-4">
        </div>
        <div>
          <label class="text-sm text-gray-400">Unit</label>
          <input id="goal-unit" type="text" value="kg" placeholder="kg, km, times, kg bodyweight..." 
                 class="w-full bg-gray-800 rounded-2xl px-6 py-4">
        </div>
      </div>

      <div class="mt-4">
        <label class="text-sm text-gray-400">Goal Type</label>
        <select id="goal-type" class="w-full bg-gray-800 rounded-2xl px-6 py-4">
          <option value="Strength">🏋️ Strength</option>
          <option value="Cardio">🏃 Cardio</option>
          <option value="Weight">⚖️ Body Weight</option>
          <option value="Habit">🔁 Habit</option>
          <option value="Other">📌 Other</option>
        </select>
      </div>

      <div class="flex gap-3 mt-8">
        <button onclick="hideAddGoalModal()" 
                class="flex-1 py-4 rounded-2xl border border-gray-700 hover:bg-gray-800">
          Cancel
        </button>
        <button onclick="addNewGoal()" 
                class="flex-1 py-4 rounded-2xl bg-blue-600 hover:bg-blue-700">
          Create Goal
        </button>
      </div>
    </div>
  </div>

  <script>
    let workouts = JSON.parse(localStorage.getItem('workouts')) || [];
    let goals = JSON.parse(localStorage.getItem('goals')) || [];

    function saveData() {
      localStorage.setItem('workouts', JSON.stringify(workouts));
      localStorage.setItem('goals', JSON.stringify(goals));
    }

    // ==================== GOALS FUNCTIONS ====================
    function showAddGoalModal() {
      document.getElementById('goal-modal').classList.remove('hidden');
      document.getElementById('goal-name').focus();
    }

    function hideAddGoalModal() {
      document.getElementById('goal-modal').classList.add('hidden');
    }

    function addNewGoal() {
      const name = document.getElementById('goal-name').value.trim();
      if (!name) return alert("Please enter a goal name");

      const newGoal = {
        id: Date.now(),
        name: name,
        target: parseFloat(document.getElementById('goal-target').value) || 100,
        current: 0,
        unit: document.getElementById('goal-unit').value.trim() || "kg",
        type: document.getElementById('goal-type').value,
        created: new Date().toISOString()
      };

      goals.push(newGoal);
      saveData();
      hideAddGoalModal();
      renderGoals();
      alert("Goal created! 🎯");
    }

    function updateGoalProgress(id, newCurrent) {
      const goal = goals.find(g => g.id === id);
      if (goal) {
        goal.current = Math.max(0, Math.min(goal.target, parseFloat(newCurrent) || 0));
        saveData();
        renderGoals();
      }
    }

    function deleteGoal(id) {
      if (confirm("Delete this goal?")) {
        goals = goals.filter(g => g.id !== id);
        saveData();
        renderGoals();
      }
    }

    function renderGoals() {
      const container = document.getElementById('goals-list');
      const empty = document.getElementById('empty-goals');

      if (goals.length === 0) {
        container.innerHTML = '';
        empty.classList.remove('hidden');
        return;
      }

      empty.classList.add('hidden');

      const html = goals.map(goal => {
        const progress = goal.target > 0 ? Math.min(Math.round((goal.current / goal.target) * 100), 100) : 0;
        return `
          <div class="bg-gray-900 rounded-3xl p-6">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-2xl">${getGoalEmoji(goal.type)}</span>
                <span class="font-semibold text-xl ml-3">${goal.name}</span>
              </div>
              <button onclick="deleteGoal(${goal.id})" class="text-red-500 hover:text-red-600">
                <i class="fas fa-trash"></i>
              </button>
            </div>

            <div class="mt-6">
              <div class="flex justify-between text-sm mb-2">
                <span class="text-gray-400">Progress</span>
                <span class="font-mono">${goal.current} / ${goal.target} ${goal.unit}</span>
              </div>
              <div class="h-3 bg-gray-800 rounded-full overflow-hidden">
                <div class="progress-bar h-full bg-gradient-to-r from-blue-500 to-purple-500" 
                     style="width: ${progress}%"></div>
              </div>
            </div>

            <div class="mt-4 flex gap-3">
              <input type="number" value="${goal.current}" 
                     onchange="updateGoalProgress(${goal.id}, this.value)"
                     class="bg-gray-800 w-24 rounded-xl px-4 py-2 text-center">
              <span class="text-gray-400 self-center">${goal.unit}</span>
            </div>
          </div>
        `;
      }).join('');

      container.innerHTML = html;
    }

    function getGoalEmoji(type) {
      const map = { "Strength": "🏋️", "Cardio": "🏃", "Weight": "⚖️", "Habit": "🔁", "Other": "🎯" };
      return map[type] || "🎯";
    }

    // Existing functions (logWorkout, renderDashboard, etc.) remain the same
    // ... (I'll keep them short here for space)

    function showPage(page) {
      document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
      document.getElementById(page).classList.remove('hidden');
      
      if (page === 'dashboard') renderDashboard();
      if (page === 'history') renderHistory();
      if (page === 'goals') renderGoals();
    }

    // Initialize
    showPage('dashboard');
    renderGoals();
  </script>
</body>
</html>
