<!DOCTYPE html>k
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCheck • Nutrition Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        * { transition: all 0.2s ease; }
        .food-card:hover { transform: translateY(-2px); box-shadow: 0 15px 20px -5px rgb(16 185 129 / 0.1); }
        .tab-active { border-bottom: 3px solid #10b981; color: #10b981; font-weight: 600; }
        .modal { animation: modalPop 0.3s ease-out; }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .foods-grid { display: grid; gap: 14px; }
        @media (max-width: 480px) { .foods-grid { grid-template-columns: 1fr; } }
        @media (min-width: 481px) and (max-width: 768px) { .foods-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 769px) { .foods-grid { grid-template-columns: repeat(4, 1fr); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans">

    <!-- HEADER -->

                </div>
                <div class="flex items-center gap-x-6 text-sm font-medium">
                    <a onclick="navigateTo('dashboard')" id="nav-dashboard" class="tab-active cursor-pointer">Dashboard</a>
                    <a onclick="navigateTo('foods')" id="nav-foods" class="cursor-pointer">Foods</a>
                    <a onclick="navigateTo('log')" id="nav-log" class="cursor-pointer">Log</a>
                    <a onclick="navigateTo('calendar')" id="nav-calendar" class="cursor-pointer">Calendar</a>
                    <a onclick="navigateTo('goals')" id="nav-goals" class="cursor-pointer">Goals</a>
                </div>
            </div>
        </div>
    </div>

                <div id="macros-breakdown" class="space-y-6"></div>
            </div>
        </div>

        <!-- FOODS PAGE -->
        <div id="page-foods" class="page hidden">
            <div class="mb-6">
                <h2 class="text-3xl font-semibold">Foods Database</h2>
                <p class="text-emerald-400 text-sm">All your requested Indian + global dishes included</p>
            </div>

            <div class="relative mb-6">
                <input id="food-search" placeholder="Search biryani, gulab jamun, paneer butter masala..." 
                       class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-3xl pl-12 py-4 outline-none"
                       onkeyup="if(event.key==='Enter') filterFoods()">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>

            <div class="flex flex-wrap gap-2 mb-6 text-sm">
                <button onclick="filterCategory('all')" id="cat-all" class="px-5 py-2 bg-emerald-500 text-white rounded-3xl">All</button>
                <button onclick="filterCategory('indian')" id="cat-indian" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl">Indian</button>
                <button onclick="filterCategory('fastfood')" id="cat-fastfood" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl">Fast Food</button>
                <button onclick="filterCategory('sweets')" id="cat-sweets" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl">Sweets</button>
                <button onclick="filterCategory('drinks')" id="cat-drinks" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl">Drinks</button>
            </div>

            <div id="foods-grid" class="foods-grid"></div>
        </div>

        <!-- DAILY LOG -->
        <div id="page-log" class="page hidden">

            <div id="log-items" class="space-y-3 mb-8"></div>

                    <div><div class="text-xs text-slate-400">Protein</div><div id="log-prot" class="text-3xl font-semibold text-emerald-400">0g</div></div>
                    <div><div class="text-xs text-slate-400">Carbs</div><div id="log-carb" class="text-3xl font-semibold text-emerald-400">0g</div></div>
                    <div><div class="text-xs text-slate-400">Fat</div><div id="log-fat" class="text-3xl font-semibold text-emerald-400">0g</div></div>
                </div>
            </div>
            <button onclick="navigateTo('foods')" class="w-full h-14 bg-emerald-500 rounded-3xl mt-6 text-lg font-medium">+ Add Food</button>
        </div>

        <!-- CALENDAR -->
        <div id="page-calendar" class="page hidden">
            <h2 class="text-3xl font-semibold mb-6">Diet Calendar</h2>
            <div id="calendar-grid" class="grid grid-cols-7 gap-3 text-center text-sm"></div>
        </div>

        <!-- GOALS -->
        <div id="page-goals" class="page hidden">
            <h2 class="text-3xl font-semibold mb-6">Daily Goals</h2>
            <div class="bg-slate-900 rounded-3xl p-8 max-w-md mx-auto">
                <div class="space-y-6">
                    <div>
                        <label class="text-sm text-slate-400">Calories</label>
                        <input id="goal-cal" type="number" value="2000" class="w-full bg-slate-800 rounded-2xl px-5 py-4 text-3xl font-semibold outline-none">
                    </div>
                    <div class="grid grid-cols-3 gap-4">
                        <div><label class="text-sm text-slate-400">Protein (g)</label><input id="goal-prot" type="number" value="120" class="w-full bg-slate-800 rounded-2xl px-5 py-4 text-2xl font-semibold outline-none"></div>
                        <div><label class="text-sm text-slate-400">Carbs (g)</label><input id="goal-carb" type="number" value="250" class="w-full bg-slate-800 rounded-2xl px-5 py-4 text-2xl font-semibold outline-none"></div>
                        <div><label class="text-sm text-slate-400">Fat (g)</label><input id="goal-fat" type="number" value="65" class="w-full bg-slate-800 rounded-2xl px-5 py-4 text-2xl font-semibold outline-none"></div>
                    </div>
                </div>
                <button onclick="saveGoals()" class="mt-10 w-full h-14 bg-emerald-500 rounded-3xl text-lg font-medium">Save Goals</button>
            </div>
        </div>

        <!-- BMI -->
        <div id="page-bmi" class="page hidden">
            <h2 class="text-3xl font-semibold mb-8">BMI Calculator</h2>
            <div class="max-w-md mx-auto bg-slate-900 rounded-3xl p-8">
                <div class="space-y-6">
                    <div><label class="block text-sm text-slate-400 mb-2">Weight (kg)</label><input id="bmi-weight" type="number" value="70" class="w-full bg-slate-800 rounded-2xl px-6 py-4 text-2xl outline-none"></div>
                    <div><label class="block text-sm text-slate-400 mb-2">Height (cm)</label><input id="bmi-height" type="number" value="170" class="w-full bg-slate-800 rounded-2xl px-6 py-4 text-2xl outline-none"></div>
                </div>
                <button onclick="calculateBMI()" class="mt-10 w-full h-14 bg-emerald-500 rounded-3xl text-lg font-medium">Calculate BMI</button>
                <div id="bmi-result" class="mt-8 text-center text-2xl font-semibold"></div>
            </div>
        </div>
    </div>

    <!-- ADD MODAL -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4">
        <div onclick="event.stopImmediatePropagation()" class="modal bg-slate-900 w-full max-w-sm rounded-3xl p-6">
            <h3 class="text-lg font-semibold mb-5" id="modal-food-name"></h3>
            <div class="mb-6">
                <label class="text-xs text-slate-400 block mb-2">SERVINGS</label>
                <div class="flex items-center justify-center gap-4">
                    <button onclick="changeQuantity(-0.5)" class="w-9 h-9 bg-slate-800 rounded-2xl text-2xl">-</button>
                    <input id="modal-quantity" type="number" step="0.25" value="1" class="text-center text-4xl font-semibold bg-transparent w-20 outline-none">
                    <button onclick="changeQuantity(0.5)" class="w-9 h-9 bg-slate-800 rounded-2xl text-2xl">+</button>
                </div>
            </div>
            <div id="modal-nutrition" class="grid grid-cols-2 gap-3"></div>
            <div class="flex gap-3 mt-8">
                <button onclick="hideAddModal()" class="flex-1 h-12 border border-slate-600 rounded-3xl">Cancel</button>
                <button onclick="confirmAddToLog()" class="flex-1 h-12 bg-emerald-500 rounded-3xl text-white">Add to Log</button>
            </div>
        </div>
    </div>

            { id: 56, name: "Medu Vada (2 pcs)", category: "indian", serving: "2 pieces", calories: 240, protein: 8, carbs: 22, fat: 14 },
            { id: 57, name: "Uttapam", category: "indian", serving: "1 piece", calories: 260, protein: 6, carbs: 42, fat: 9 },
            { id: 58, name: "Upma", category: "indian", serving: "1 bowl", calories: 240, protein: 6, carbs: 38, fat: 8 }
        ];

        let dailyData = {};
        let goals = { calories: 2000, protein: 120, carbs: 250, fat: 65, water: 2500 };
        let currentAddFood = null;
        let currentQuantity = 1;
        let currentCategoryFilter = 'all';

        function getTodayKey() { return new Date().toISOString().split('T')[0]; }

        function loadData() {
            const saved = localStorage.getItem('nutricheck_data');
            if (saved) {
                const data = JSON.parse(saved);
                dailyData = data.dailyData || {};
                goals = data.goals || goals;
            }
        }

        function saveData() {
            localStorage.setItem('nutricheck_data', JSON.stringify({ dailyData, goals }));
        }

        function getTodayData() {
            const key = getTodayKey();
            if (!dailyData[key]) dailyData[key] = { log: [] };
            return dailyData[key];
        }

        function calculateTotals(log) {
            return log.reduce((acc, item) => {
                acc.calories += item.calories || 0;
                acc.protein += item.protein || 0;
                acc.carbs += item.carbs || 0;
                acc.fat += item.fat || 0;
                return acc;
            }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
        }

        function renderDashboard() {
            const today = getTodayData();
            const totals = calculateTotals(today.log);
            const percent = Math.min(Math.round((totals.calories / goals.calories) * 100), 100);

            document.getElementById('summary-cards').innerHTML = `
                <div class="bg-slate-900 rounded-3xl p-6">
                    <div class="text-5xl font-semibold text-emerald-400">${totals.calories}</div>
                    <div class="text-slate-400">of ${goals.calories} kcal</div>
                    <div class="h-2 bg-slate-700 rounded-full mt-4"><div class="h-2 bg-emerald-500 rounded-full" style="width:${percent}%"></div></div>
                </div>
            `;

            document.getElementById('macros-breakdown').innerHTML = `
                <div class="flex justify-between"><span>Protein</span><span>${totals.protein}g / ${goals.protein}g</span></div>
                <div class="flex justify-between"><span>Carbs</span><span>${totals.carbs}g / ${goals.carbs}g</span></div>
                <div class="flex justify-between"><span>Fat</span><span>${totals.fat}g / ${goals.fat}g</span></div>
            `;
        }

        function renderLog() {
            const today = getTodayData();
            const totals = calculateTotals(today.log);
            const container = document.getElementById('log-items');
            container.innerHTML = '';

            if (today.log.length === 0) {
                container.innerHTML = '<div class="text-center py-12 text-slate-400">No food logged yet today</div>';
                return;
            }

            today.log.forEach(item => {
                const div = document.createElement('div');
                div.className = "bg-slate-900 rounded-3xl p-4 flex justify-between items-center";
                div.innerHTML = `
                    <div>
                        <div class="font-medium">${item.name}</div>
                        <div class="text-xs text-slate-400">${item.quantity} × ${item.serving}</div>
                    </div>
                    <div class="text-emerald-400 font-semibold">${item.calories} kcal</div>
                `;
                container.appendChild(div);
            });

            document.getElementById('log-cal').textContent = totals.calories;
            document.getElementById('log-prot').textContent = totals.protein + "g";
            document.getElementById('log-carb').textContent = totals.carbs + "g";
            document.getElementById('log-fat').textContent = totals.fat + "g";
        }

        function renderCalendar() {
            document.getElementById('calendar-grid').innerHTML = `<div class="col-span-7 py-12 text-center text-slate-400">Calendar with streak tracking coming soon</div>`;
        }

        function calculateBMI() {
            const weight = parseFloat(document.getElementById('bmi-weight').value);
            const height = parseFloat(document.getElementById('bmi-height').value) / 100;
            if (!weight || !height) return;
            const bmi = (weight / (height * height)).toFixed(1);
            let status = bmi < 18.5 ? "Underweight" : bmi < 25 ? "Normal" : bmi < 30 ? "Overweight" : "Obese";
            document.getElementById('bmi-result').innerHTML = `BMI: <span class="text-emerald-400">${bmi}</span><br><span class="text-sm">${status}</span>`;
        }

        function saveGoals() {
            goals.calories = parseInt(document.getElementById('goal-cal').value) || 2000;
            goals.protein = parseInt(document.getElementById('goal-prot').value) || 120;
            goals.carbs = parseInt(document.getElementById('goal-carb').value) || 250;
            goals.fat = parseInt(document.getElementById('goal-fat').value) || 65;
            saveData();
            alert("Goals saved successfully!");
            navigateTo('dashboard');
        }

        function filterCategory(cat) {
            currentCategoryFilter = cat;
            document.querySelectorAll('#page-foods button').forEach(b => {
                b.classList.toggle('bg-emerald-500', b.id === `cat-${cat}`);
                b.classList.toggle('text-white', b.id === `cat-${cat}`);
            });
            filterFoods();
        }

        function filterFoods() {
            let filtered = FOODS_DB;
            if (currentCategoryFilter !== 'all') {
                filtered = filtered.filter(f => f.category === currentCategoryFilter);
            }
            const query = document.getElementById('food-search').value.toLowerCase().trim();
            if (query) filtered = filtered.filter(f => f.name.toLowerCase().includes(query));
            renderFoods(filtered);
        }

        function renderFoods(foods) {
            const container = document.getElementById('foods-grid');
            container.innerHTML = '';
            foods.forEach(food => {
                const card = document.createElement('div');
                card.className = `food-card bg-slate-900 rounded-3xl border border-slate-800 p-4`;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="font-medium text-[15px]">${food.name}</div>
                            <div class="text-xs text-slate-400">${food.serving}</div>
                        </div>
                        <button onclick="event.stopImmediatePropagation(); addFoodToLogPrompt(${food.id});" 
                                class="w-8 h-8 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center text-xl">＋</button>
                    </div>
                    <div class="grid grid-cols-4 gap-2 mt-5 text-center text-xs">
                        <div><span class="text-emerald-400 font-semibold">${food.calories}</span><br>kcal</div>
                        <div><span class="text-emerald-400 font-semibold">${food.protein}</span><br>P</div>
                        <div><span class="text-emerald-400 font-semibold">${food.carbs}</span><br>C</div>
                        <div><span class="text-emerald-400 font-semibold">${food.fat}</span><br>F</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addFoodToLogPrompt(id) {
            currentAddFood = FOODS_DB.find(f => f.id === id);
            if (!currentAddFood) return;
            currentQuantity = 1;
            document.getElementById('modal-food-name').textContent = currentAddFood.name;
            updateModalNutrition();
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        }

        function updateModalNutrition() {
            if (!currentAddFood) return;
            const q = currentQuantity;
            document.getElementById('modal-nutrition').innerHTML = `
                <div class="bg-slate-800 rounded-2xl p-3 text-center"><div class="text-xs text-slate-400">CAL</div><div class="text-2xl font-semibold text-emerald-400">${Math.round(currentAddFood.calories * q)}</div></div>
                <div class="bg-slate-800 rounded-2xl p-3 text-center"><div class="text-xs text-slate-400">PROT</div><div class="text-2xl font-semibold">${(currentAddFood.protein * q).toFixed(1)}</div></div>
                <div class="bg-slate-800 rounded-2xl p-3 text-center"><div class="text-xs text-slate-400">CARB</div><div class="text-2xl font-semibold">${(currentAddFood.carbs * q).toFixed(1)}</div></div>
                <div class="bg-slate-800 rounded-2xl p-3 text-center"><div class="text-xs text-slate-400">FAT</div><div class="text-2xl font-semibold">${(currentAddFood.fat * q).toFixed(1)}</div></div>
            `;
        }

        function changeQuantity(delta) {
            currentQuantity = Math.max(0.25, currentQuantity + delta);
            updateModalNutrition();
        }

        function hideAddModal() {
            const m = document.getElementById('add-modal');
            m.classList.add('hidden');
            m.classList.remove('flex');
        }

        function confirmAddToLog() {
            if (!currentAddFood) return;
            const today = getTodayData();
            const item = {
                id: Date.now(),
                name: currentAddFood.name,
                serving: currentAddFood.serving,
                quantity: currentQuantity,
                calories: Math.round(currentAddFood.calories * currentQuantity),
                protein: Number((currentAddFood.protein * currentQuantity).toFixed(1)),
                carbs: Number((currentAddFood.carbs * currentQuantity).toFixed(1)),
                fat: Number((currentAddFood.fat * currentQuantity).toFixed(1))
            };
            today.log.unshift(item);
            saveData();
            hideAddModal();
            showToast(`${currentQuantity}× ${item.name} added`);
            if (!document.getElementById('page-log').classList.contains('hidden')) renderLog();
            if (!document.getElementById('page-dashboard').classList.contains('hidden')) renderDashboard();
        }

        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(`page-${page}`).classList.remove('hidden');

            document.querySelectorAll('a[id^="nav-"]').forEach(a => a.classList.remove('tab-active'));
            const active = document.getElementById(`nav-${page}`);
            if (active) active.classList.add('tab-active');

            if (page === 'dashboard') renderDashboard();
            if (page === 'log') renderLog();
            if (page === 'calendar') renderCalendar();
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:12px 24px;border-radius:9999px;z-index:9999;`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2200);
        }

        function initApp() {
            loadData();
            navigateTo('dashboard');
            console.log("%c✅ All requested foods successfully added. Total foods: " + FOODS_DB.length, "color:#10b981");
        }

        window.onload = initApp;
    </script>
</body>
</html>
