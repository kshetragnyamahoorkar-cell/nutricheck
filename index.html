<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loomis Method - From Image</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #1e1e1e;
      color: #eee;
    }
    header {
      background: #333;
      padding: 15px;
      text-align: center;
      font-size: 26px;
      font-weight: bold;
    }
    .container {
      display: flex;
      height: calc(100vh - 60px);
    }
    .sidebar {
      width: 300px;
      background: #252525;
      padding: 15px;
      overflow-y: auto;
    }
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      position: relative;
    }
    canvas {
      border: 2px solid #555;
      max-width: 100%;
      max-height: 100%;
      background: #222;
    }
    button, input[type="file"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      background: #0066ff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #3388ff; }
    .slider {
      width: 100%;
    }
    label { display: block; margin: 8px 0 4px; }
  </style>
</head>
<body>

  <header>🧠 Loomis Method on Your Image</header>
  
  <div class="container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h3>1. Upload Reference Image</h3>
      <input type="file" id="imageUpload" accept="image/*">

      <h3>2. Adjust Loomis Guidelines</h3>
      
      <label>Head Tilt (Rotation): <span id="rotVal">0</span>°</label>
      <input type="range" id="rotation" class="slider" min="-60" max="60" value="0">

      <label>Eye Line Height: <span id="eyeVal">50</span>%</label>
      <input type="range" id="eyeLevel" class="slider" min="30" max="70" value="50">

      <label>Head Size: <span id="sizeVal">100</span>%</label>
      <input type="range" id="headSize" class="slider" min="50" max="150" value="100">

      <button onclick="clearDrawing()">Clear My Drawing</button>
      <button onclick="resetGuidelines()">Reset Guidelines</button>
      <button onclick="toggleGuidelines()">Toggle Guidelines</button>
    </div>

    <!-- Canvas Area -->
    <div class="main">
      <canvas id="canvas" width="900" height="700"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let img = new Image();
    let guidelinesOn = true;
    let drawing = false;

    // Load uploaded image
    document.getElementById('imageUpload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = function(event) {
        img.onload = function() {
          draw();
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw uploaded image centered
      if (img.src) {
        const scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.95;
        const w = img.width * scale;
        const h = img.height * scale;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;
        ctx.drawImage(img, x, y, w, h);
      }

      if (!guidelinesOn) return;

      const rot = parseFloat(document.getElementById('rotation').value);
      const eyePercent = parseFloat(document.getElementById('eyeLevel').value) / 100;
      const sizeMult = parseFloat(document.getElementById('headSize').value) / 100;

      document.getElementById('rotVal').textContent = rot;
      document.getElementById('eyeVal').textContent = Math.round(eyePercent * 100);
      document.getElementById('sizeVal').textContent = Math.round(sizeMult * 100);

      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(rot * Math.PI / 180);

      const radius = 180 * sizeMult;

      // 1. Cranium (Ball)
      ctx.strokeStyle = '#00ddff';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, -radius * 0.1, radius, 0, Math.PI * 2);
      ctx.stroke();

      // 2. Jaw Line
      ctx.beginPath();
      ctx.moveTo(-radius * 0.75, radius * 0.55);
      ctx.quadraticCurveTo(0, radius * 1.25, radius * 0.75, radius * 0.55);
      ctx.stroke();

      // Center Line
      ctx.strokeStyle = '#ff00ff';
      ctx.beginPath();
      ctx.moveTo(0, -radius * 1.1);
      ctx.lineTo(0, radius * 1.3);
      ctx.stroke();

      // Eye Line
      ctx.strokeStyle = '#ffff00';
      ctx.beginPath();
      ctx.moveTo(-radius, radius * (eyePercent - 0.1) * 1.8 - radius * 0.1);
      ctx.lineTo(radius, radius * (eyePercent - 0.1) * 1.8 - radius * 0.1);
      ctx.stroke();

      // Nose Line
      ctx.beginPath();
      ctx.moveTo(-radius * 0.45, radius * (eyePercent + 0.25) * 1.6);
      ctx.lineTo(radius * 0.45, radius * (eyePercent + 0.25) * 1.6);
      ctx.stroke();

      // Mouth Line
      ctx.beginPath();
      ctx.moveTo(-radius * 0.4, radius * (eyePercent + 0.55) * 1.4);
      ctx.lineTo(radius * 0.4, radius * (eyePercent + 0.55) * 1.4);
      ctx.stroke();

      ctx.restore();
    }

    // Real-time update
    document.querySelectorAll('input[type="range"]').forEach(slider => {
      slider.addEventListener('input', draw);
    });

    function toggleGuidelines() {
      guidelinesOn = !guidelinesOn;
      draw();
    }

    function resetGuidelines() {
      document.getElementById('rotation').value = 0;
      document.getElementById('eyeLevel').value = 50;
      document.getElementById('headSize').value = 100;
      draw();
    }

    function clearDrawing() {
      draw(); // redraws image + guidelines only
    }

    // Mouse drawing on top
    canvas.addEventListener('mousedown', () => drawing = true);
    canvas.addEventListener('mouseup', () => drawing = false);
    canvas.addEventListener('mousemove', (e) => {
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(e.clientX - rect.left - 3, e.clientY - rect.top - 3);
      ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
      ctx.stroke();
    });

    // Initial message
    ctx.fillStyle = "#888";
    ctx.font = "24px Arial";
    ctx.fillText("Upload a face photo to start", canvas.width/2 - 180, canvas.height/2);
  </script>
</body>
</html>
