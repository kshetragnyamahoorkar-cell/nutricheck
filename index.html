<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCheck • Nutrition Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        * { transition: all 0.2s ease; }
        
        .food-card {
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .food-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 20px -5px rgb(16 185 129 / 0.1);
        }
        
        .tab-active {
            border-bottom: 3px solid #10b981;
            color: #10b981;
            font-weight: 600;
        }
        
        .modal {
            animation: modalPop 0.3s ease-out;
        }
        
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Optimized Mobile with Smaller Touch Targets */
        .foods-grid {
            display: grid;
            gap: 14px;
        }

        .food-card {
            padding: 16px 14px;
        }

        .add-btn {
            width: 32px;
            height: 32px;
            font-size: 18px;
        }

        .nutrition-grid {
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .nutrition-item {
            padding: 10px 8px;
        }

        @media (max-width: 480px) {
            .food-card {
                padding: 14px 12px;
            }
            .add-btn {
                width: 30px;
                height: 30px;
                font-size: 16px;
            }
            .nutrition-grid {
                gap: 8px;
            }
            .nutrition-item {
                padding: 9px 6px;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .foods-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
            }
        }

        @media (min-width: 769px) {
            .foods-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
            .nutrition-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans">

    <!-- HEADER -->
    <div class="border-b border-slate-800 bg-slate-950 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center gap-x-3">
                    <div class="w-8 h-8 bg-emerald-500 rounded-2xl flex items-center justify-center text-white text-xl">🍛</div>
                    <h1 class="text-xl font-semibold tracking-tight" style="font-family: 'Space Grotesk', sans-serif;">NutriCheck</h1>
                </div>

                <div class="hidden md:flex items-center gap-x-6 text-sm font-medium">
                    <a onclick="navigateTo('dashboard')" id="nav-dashboard" class="tab-active flex items-center gap-x-1.5 cursor-pointer">Dashboard</a>
                    <a onclick="navigateTo('foods')" id="nav-foods" class="flex items-center gap-x-1.5 cursor-pointer">Foods</a>
                    <a onclick="navigateTo('log')" id="nav-log" class="flex items-center gap-x-1.5 cursor-pointer">Log</a>
                    <a onclick="navigateTo('goals')" id="nav-goals" class="flex items-center gap-x-1.5 cursor-pointer">Goals</a>
                    <a onclick="navigateTo('hydration')" id="nav-hydration" class="flex items-center gap-x-1.5 cursor-pointer">Hydration</a>
                </div>

                <div class="flex items-center gap-x-3">
                    <div onclick="showDateInfo()" class="text-xs px-3 py-1.5 bg-slate-900 rounded-3xl border border-slate-700 cursor-pointer hidden sm:flex items-center gap-1">
                        <i class="fa-solid fa-calendar text-emerald-400"></i>
                        <span id="current-date"></span>
                    </div>
                    <div class="w-7 h-7 bg-slate-700 rounded-2xl flex items-center justify-center text-sm">👤</div>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-5">

        <!-- FOODS PAGE -->
        <div id="page-foods" class="page">
            <div class="mb-5">
                <h2 class="text-3xl font-semibold">Foods Database</h2>
                <p class="text-slate-400 text-sm mt-0.5">250+ dishes • Tap + to add</p>
            </div>

            <!-- Filters -->
            <div class="flex flex-wrap gap-2 mb-6 text-sm">
                <button onclick="filterCategory('all')" id="cat-all" class="px-5 py-2 bg-emerald-500 text-white rounded-3xl font-medium">All</button>
                <button onclick="filterCategory('fastfood')" id="cat-fastfood" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl font-medium">Fast Food</button>
                <button onclick="filterCategory('indian')" id="cat-indian" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl font-medium">Indian</button>
                <button onclick="filterCategory('sweets')" id="cat-sweets" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl font-medium">Sweets</button>
                <button onclick="filterCategory('drinks')" id="cat-drinks" class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl font-medium">Drinks</button>
            </div>

            <!-- Search -->
            <div class="relative mb-6">
                <input id="food-search" placeholder="Search any food..." 
                       class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-3xl pl-12 py-3.5 text-base outline-none"
                       onkeyup="if(event.key==='Enter') filterFoods()">
                <i class="fa-solid fa-magnifying-glass absolute left-5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>

            <!-- Optimized Foods Grid -->
            <div id="foods-grid" class="foods-grid"></div>
        </div>
    </div>

    <!-- ADD MODAL - Compact for mobile -->
    <div id="add-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4">
        <div onclick="event.stopImmediatePropagation()" 
             class="modal bg-slate-900 w-full max-w-sm rounded-3xl p-6">
            <h3 class="text-lg font-semibold mb-5" id="modal-food-name"></h3>
            
            <div class="mb-6">
                <label class="text-xs text-slate-400 block mb-2">SERVINGS</label>
                <div class="flex items-center justify-center gap-4">
                    <button onclick="changeQuantity(-0.5)" class="w-9 h-9 bg-slate-800 rounded-2xl text-2xl flex items-center justify-center active:scale-95">-</button>
                    <input id="modal-quantity" type="number" step="0.25" value="1" 
                           class="text-center text-4xl font-semibold bg-transparent w-20 outline-none">
                    <button onclick="changeQuantity(0.5)" class="w-9 h-9 bg-slate-800 rounded-2xl text-2xl flex items-center justify-center active:scale-95">+</button>
                </div>
            </div>

            <div id="modal-nutrition" class="grid grid-cols-2 gap-3"></div>

            <div class="flex gap-3 mt-8">
                <button onclick="hideAddModal()" 
                        class="flex-1 h-12 border border-slate-600 rounded-3xl text-sm font-medium">Cancel</button>
                <button onclick="confirmAddToLog()" 
                        class="flex-1 h-12 bg-emerald-500 rounded-3xl text-sm font-medium text-white">Add to Log</button>
            </div>
        </div>
    </div>

    <script>
        let FOODS_DB = [
            { id: 100, name: "Big Mac", category: "fastfood", serving: "1 burger", calories: 540, protein: 25, carbs: 45, fat: 29 },
            { id: 101, name: "McAloo Tikki Burger", category: "fastfood", serving: "1 burger", calories: 340, protein: 8, carbs: 48, fat: 14 },
            { id: 102, name: "Zinger Burger", category: "fastfood", serving: "1 burger", calories: 450, protein: 20, carbs: 40, fat: 25 },
            { id: 103, name: "Vada Pav", category: "fastfood", serving: "1 piece", calories: 290, protein: 6, carbs: 35, fat: 14 },
            { id: 104, name: "Pav Bhaji", category: "fastfood", serving: "1 plate", calories: 450, protein: 10, carbs: 55, fat: 18 },
            { id: 105, name: "Hyderabadi Chicken Biryani", category: "indian", serving: "1 plate", calories: 580, protein: 28, carbs: 65, fat: 22 },
            { id: 106, name: "Hyderabadi Veg Biryani", category: "indian", serving: "1 plate", calories: 420, protein: 12, carbs: 68, fat: 14 },
            { id: 107, name: "Butter Chicken", category: "indian", serving: "1 bowl", calories: 520, protein: 28, carbs: 25, fat: 32 },
            { id: 108, name: "Paneer Butter Masala", category: "indian", serving: "1 bowl", calories: 480, protein: 18, carbs: 22, fat: 35 },
            { id: 109, name: "Masala Dosa", category: "indian", serving: "1 piece", calories: 280, protein: 7, carbs: 48, fat: 8 },
            { id: 110, name: "Idli (2 pcs)", category: "indian", serving: "2 pieces", calories: 120, protein: 4, carbs: 24, fat: 1 },
            { id: 111, name: "Gulab Jamun (2 pcs)", category: "sweets", serving: "2 pieces", calories: 320, protein: 6, carbs: 48, fat: 12 },
            { id: 112, name: "Rasgulla (2 pcs)", category: "sweets", serving: "2 pieces", calories: 180, protein: 4, carbs: 38, fat: 1 },
            { id: 113, name: "Masala Chai", category: "drinks", serving: "1 cup", calories: 80, protein: 2, carbs: 10, fat: 4 },
            { id: 114, name: "Sweet Lassi", category: "drinks", serving: "1 glass", calories: 220, protein: 8, carbs: 28, fat: 8 }
        ];

        let customFoods = [];
        let currentAddFood = null;
        let currentQuantity = 1;
        let currentCategoryFilter = 'all';

        function loadData() {
            return [...FOODS_DB, ...customFoods];
        }

        function filterCategory(cat) {
            currentCategoryFilter = cat;
            document.querySelectorAll('#page-foods button').forEach(b => {
                b.classList.toggle('bg-emerald-500', b.id === `cat-${cat}`);
                b.classList.toggle('text-white', b.id === `cat-${cat}`);
            });
            filterFoods();
        }

        function filterFoods() {
            const foods = loadData();
            const q = document.getElementById('food-search').value.toLowerCase().trim();
            let filtered = foods;

            if (currentCategoryFilter !== 'all') {
                filtered = filtered.filter(f => f.category === currentCategoryFilter);
            }
            if (q) {
                filtered = filtered.filter(f => f.name.toLowerCase().includes(q));
            }

            renderFoods(filtered);
        }

        function renderFoods(foods) {
            const container = document.getElementById('foods-grid');
            container.innerHTML = '';

            if (foods.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400">No foods found</div>`;
                return;
            }

            foods.forEach(food => {
                const div = document.createElement('div');
                div.className = `food-card bg-slate-900 rounded-3xl border border-slate-800`;
                div.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1 pr-2">
                            <div class="font-medium text-[15px] leading-tight">${food.name}</div>
                            <div class="text-xs text-slate-400 mt-1">${food.serving}</div>
                        </div>
                        <button onclick="event.stopImmediatePropagation(); addFoodToLogPrompt(${food.id});" 
                                class="add-btn bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center flex-shrink-0">＋</button>
                    </div>
                    <div class="nutrition-grid mt-5">
                        <div class="nutrition-item bg-slate-800/80 rounded-2xl text-center">
                            <div class="text-emerald-400 text-xl font-semibold">${food.calories}</div>
                            <div class="text-[10px] text-slate-400">kcal</div>
                        </div>
                        <div class="nutrition-item bg-slate-800/80 rounded-2xl text-center">
                            <div class="text-emerald-400 text-xl font-semibold">${food.protein}</div>
                            <div class="text-[10px] text-slate-400">P</div>
                        </div>
                        <div class="nutrition-item bg-slate-800/80 rounded-2xl text-center">
                            <div class="text-emerald-400 text-xl font-semibold">${food.carbs}</div>
                            <div class="text-[10px] text-slate-400">C</div>
                        </div>
                        <div class="nutrition-item bg-slate-800/80 rounded-2xl text-center">
                            <div class="text-emerald-400 text-xl font-semibold">${food.fat}</div>
                            <div class="text-[10px] text-slate-400">F</div>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function addFoodToLogPrompt(id) {
            const all = loadData();
            currentAddFood = all.find(f => f.id === id);
            if (!currentAddFood) return;

            currentQuantity = 1;
            document.getElementById('modal-food-name').textContent = currentAddFood.name;
            updateModalNutrition();
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        }

        function updateModalNutrition() {
            if (!currentAddFood) return;
            const q = currentQuantity;
            document.getElementById('modal-nutrition').innerHTML = `
                <div class="bg-slate-800 rounded-2xl p-3 text-center">
                    <div class="text-xs text-slate-400">CAL</div>
                    <div class="text-2xl font-semibold text-emerald-400">${Math.round(currentAddFood.calories * q)}</div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-3 text-center">
                    <div class="text-xs text-slate-400">PROT</div>
                    <div class="text-2xl font-semibold">${(currentAddFood.protein * q).toFixed(1)}</div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-3 text-center">
                    <div class="text-xs text-slate-400">CARB</div>
                    <div class="text-2xl font-semibold">${(currentAddFood.carbs * q).toFixed(1)}</div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-3 text-center">
                    <div class="text-xs text-slate-400">FAT</div>
                    <div class="text-2xl font-semibold">${(currentAddFood.fat * q).toFixed(1)}</div>
                </div>
            `;
        }

        function changeQuantity(d) {
            currentQuantity = Math.max(0.25, currentQuantity + d);
            updateModalNutrition();
        }

        function hideAddModal() {
            const m = document.getElementById('add-modal');
            m.classList.add('hidden');
            m.classList.remove('flex');
        }

        function confirmAddToLog() {
            if (!currentAddFood) return;
            hideAddModal();
            showToast(`${currentQuantity}× ${currentAddFood.name} added`);
        }

        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            const el = document.getElementById(`page-${page}`);
            if (el) el.classList.remove('hidden');
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:12px 20px;border-radius:9999px;font-size:14px;z-index:9999;`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2000);
        }

        function showDateInfo() {
            alert(new Date().toLocaleDateString('en-IN', {weekday:'long', month:'long', day:'numeric'}));
        }

        function initApp() {
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-IN', {weekday:'short', month:'short', day:'numeric'});
            navigateTo('foods');
            filterFoods();
            console.log("%c✅ Mobile touch targets reduced & spacing optimized", "color:#10b981");
        }

        window.onload = initApp;
    </script>
</body>
</html>
