<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCheck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        * { transition: all 0.3s ease; }
        .tab-active { border-bottom: 3px solid #10b981; color: #10b981; font-weight: 600; }
        .modal { animation: modalPop 0.3s ease-out; }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans">

    <!-- SIGN IN PAGE -->
    <div id="signin-page" class="min-h-screen flex items-center justify-center px-4">
        <div class="max-w-md w-full">
            <div class="text-center mb-10">
                <div class="w-20 h-20 mx-auto bg-emerald-500 rounded-3xl flex items-center justify-center text-4xl mb-6">🍛</div>
                <h1 class="text-4xl font-semibold tracking-tight" style="font-family: 'Space Grotesk', sans-serif;">NutriCheck</h1>
                <p class="text-slate-400 mt-2">Your personal nutrition companion</p>
            </div>

            <div class="bg-slate-900 rounded-3xl p-8">
                <h2 class="text-2xl font-semibold text-center mb-8">Sign In</h2>
                <button onclick="googleSignIn()" class="w-full h-14 bg-white text-black rounded-3xl flex items-center justify-center gap-3 font-medium hover:bg-gray-100 mb-6">
                    <i class="fa-brands fa-google text-red-500"></i>
                    Continue with Google
                </button>
                <button onclick="demoLogin()" class="w-full h-14 border border-slate-600 rounded-3xl font-medium hover:bg-slate-800">
                    Continue as Guest (Demo)
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="main-app" class="hidden">

        <!-- HEADER -->
        <div class="border-b border-slate-800 bg-slate-950 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4">
                <div class="flex items-center justify-between h-14">
                    <div class="flex items-center gap-x-3">
                        <div class="w-8 h-8 bg-emerald-500 rounded-2xl flex items-center justify-center text-white text-xl">🍛</div>
                        <h1 class="text-xl font-semibold tracking-tight" style="font-family: 'Space Grotesk', sans-serif;">NutriCheck</h1>
                    </div>
                    <button onclick="logout()" class="text-sm text-slate-400 hover:text-red-400">Logout</button>
                </div>
            </div>
        </div>

        <div class="max-w-7xl mx-auto px-4 py-6">

            <!-- DASHBOARD -->
            <div id="page-dashboard" class="page">
                <h2 class="text-3xl font-semibold mb-2">Good morning, Sai 👋</h2>
                <p class="text-slate-400 mb-8">Here's your nutrition summary for today</p>

                <!-- Goals Progress -->
                <div class="bg-slate-900 rounded-3xl p-6 mb-8">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="font-semibold">Daily Goals</h3>
                        <button onclick="navigateTo('goals')" class="text-emerald-400 text-sm">Edit Goals →</button>
                    </div>
                    <div id="goals-progress" class="space-y-5"></div>
                </div>

                <!-- Nutrition Summary -->
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8" id="summary-cards"></div>

                <!-- Today's Breakdown -->
                <div class="bg-slate-900 rounded-3xl p-6">
                    <h3 class="font-semibold mb-5">Today's Nutrition Breakdown</h3>
                    <div id="macros-breakdown" class="space-y-6"></div>
                </div>
            </div>

            <!-- Other pages (Foods, Log, etc.) -->
            <div id="page-foods" class="page hidden">Foods Page</div>
            <div id="page-log" class="page hidden">Daily Log Page</div>
            <div id="page-goals" class="page hidden">Goals Page</div>
        </div>
    </div>

    <script>
        // Safe Storage
        const storage = {
            get(key) {
                try { return localStorage.getItem(key); } catch(e) { return null; }
            },
            set(key, value) {
                try { localStorage.setItem(key, value); } catch(e) {}
            }
        };

        let goals = { calories: 2000, protein: 120, carbs: 250, fat: 65, water: 2500 };
        let dailyData = {};

        function getTodayKey() {
            return new Date().toISOString().split('T')[0];
        }

        function getTodayData() {
            const key = getTodayKey();
            if (!dailyData[key]) dailyData[key] = { log: [] };
            return dailyData[key];
        }

        function calculateTotals(log) {
            return log.reduce((acc, item) => {
                acc.calories += item.calories || 0;
                acc.protein += item.protein || 0;
                acc.carbs += item.carbs || 0;
                acc.fat += item.fat || 0;
                return acc;
            }, { calories: 0, protein: 0, carbs: 0, fat: 0 });
        }

        function renderDashboard() {
            const today = getTodayData();
            const totals = calculateTotals(today.log);

            // Goals Progress
            const goalHTML = `
                <div class="flex justify-between text-sm">
                    <span>Calories</span>
                    <span class="font-medium">${totals.calories} / ${goals.calories}</span>
                </div>
                <div class="h-2 bg-slate-700 rounded-full overflow-hidden">
                    <div class="h-2 bg-emerald-500 rounded-full" style="width: ${Math.min((totals.calories/goals.calories)*100, 100)}%"></div>
                </div>
            `;
            document.getElementById('goals-progress').innerHTML = goalHTML;

            // Summary Cards
            document.getElementById('summary-cards').innerHTML = `
                <div class="bg-slate-900 rounded-3xl p-5">
                    <div class="text-emerald-400 text-4xl font-semibold">${totals.calories}</div>
                    <div class="text-slate-400 text-sm">Calories</div>
                </div>
                <div class="bg-slate-900 rounded-3xl p-5">
                    <div class="text-blue-400 text-4xl font-semibold">${totals.protein}g</div>
                    <div class="text-slate-400 text-sm">Protein</div>
                </div>
                <div class="bg-slate-900 rounded-3xl p-5">
                    <div class="text-amber-400 text-4xl font-semibold">${totals.carbs}g</div>
                    <div class="text-slate-400 text-sm">Carbs</div>
                </div>
                <div class="bg-slate-900 rounded-3xl p-5">
                    <div class="text-orange-400 text-4xl font-semibold">${totals.fat}g</div>
                    <div class="text-slate-400 text-sm">Fat</div>
                </div>
            `;

            // Macros Breakdown
            document.getElementById('macros-breakdown').innerHTML = `
                <div class="flex justify-between items-center">
                    <span>Protein</span>
                    <span class="font-medium">${totals.protein}g / ${goals.protein}g</span>
                </div>
                <div class="flex justify-between items-center">
                    <span>Carbs</span>
                    <span class="font-medium">${totals.carbs}g / ${goals.carbs}g</span>
                </div>
                <div class="flex justify-between items-center">
                    <span>Fat</span>
                    <span class="font-medium">${totals.fat}g / ${goals.fat}g</span>
                </div>
            `;
        }

        function googleSignIn() {
            document.getElementById('signin-page').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            storage.set('nutricheck_loggedin', 'true');
            renderDashboard();
        }

        function demoLogin() {
            document.getElementById('signin-page').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            storage.set('nutricheck_loggedin', 'true');
            renderDashboard();
        }

        function logout() {
            if (confirm("Sign out?")) {
                storage.remove('nutricheck_loggedin');
                location.reload();
            }
        }

        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            const target = document.getElementById(`page-${page}`);
            if (target) target.classList.remove('hidden');
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#10b981;color:white;padding:12px 24px;border-radius:9999px;z-index:9999;`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        window.onload = () => {
            if (storage.get('nutricheck_loggedin') === 'true') {
                document.getElementById('signin-page').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');
                renderDashboard();
            }
        };
    </script>
</body>
</html>
