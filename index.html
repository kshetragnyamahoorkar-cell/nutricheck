<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCheck • Nutrition Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        * { transition: all 0.2s ease; }
        
        .food-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .food-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 25px -5px rgb(16 185 129 / 0.1);
        }
        
        .tab-active {
            border-bottom: 3px solid #10b981;
            color: #10b981;
            font-weight: 600;
        }
        
        .modal {
            animation: modalPop 0.3s ease-out;
        }
        
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Optimized Mobile Card Spacing */
        .foods-grid {
            display: grid;
            gap: 16px;
        }

        @media (max-width: 640px) {
            .foods-grid {
                grid-template-columns: 1fr;
                gap: 18px;
                padding-bottom: 80px;
            }
            
            .food-card {
                padding: 20px 18px;
                margin: 0 4px;
            }
            
            .nutrition-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }
            
            .nutrition-item {
                padding: 14px 10px;
            }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .foods-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 20px;
            }
        }

        @media (min-width: 1025px) {
            .foods-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 24px;
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen">

    <!-- HEADER -->
    <div class="border-b border-slate-800 bg-slate-950 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-x-3">
                    <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-white text-2xl">🍛</div>
                    <h1 class="text-2xl font-semibold tracking-tight" style="font-family: 'Space Grotesk', sans-serif;">NutriCheck</h1>
                </div>

                <div class="hidden md:flex items-center gap-x-8 text-sm font-medium">
                    <a onclick="navigateTo('dashboard')" id="nav-dashboard" class="tab-active flex items-center gap-x-2 cursor-pointer">Dashboard</a>
                    <a onclick="navigateTo('foods')" id="nav-foods" class="flex items-center gap-x-2 cursor-pointer">Foods</a>
                    <a onclick="navigateTo('log')" id="nav-log" class="flex items-center gap-x-2 cursor-pointer">Daily Log</a>
                    <a onclick="navigateTo('goals')" id="nav-goals" class="flex items-center gap-x-2 cursor-pointer">Goals</a>
                    <a onclick="navigateTo('hydration')" id="nav-hydration" class="flex items-center gap-x-2 cursor-pointer">Hydration</a>
                </div>

                <div class="flex items-center gap-x-4">
                    <div onclick="showDateInfo()" class="hidden sm:flex items-center gap-x-2 text-sm px-4 py-2 bg-slate-900 rounded-3xl border border-slate-700 cursor-pointer">
                        <i class="fa-solid fa-calendar text-emerald-400"></i>
                        <span id="current-date" class="font-medium"></span>
                    </div>
                    <div class="flex items-center gap-x-2 bg-slate-900 rounded-3xl px-3 py-2 border border-slate-700">
                        <div class="w-8 h-8 bg-slate-700 rounded-2xl flex items-center justify-center">👤</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6">

        <!-- FOODS PAGE -->
        <div id="page-foods" class="page">
            <div class="mb-6">
                <h2 class="text-3xl sm:text-4xl font-semibold tracking-tight">Foods Database</h2>
                <p class="text-slate-400 text-sm mt-1">250+ Indian &amp; Global dishes • Tap + to log</p>
            </div>

            <!-- Category Filters -->
            <div class="flex flex-wrap gap-2 mb-6">
                <button onclick="filterCategory('all')" id="cat-all" 
                        class="px-6 py-2.5 bg-emerald-500 text-white rounded-3xl text-sm font-medium shadow-sm">All</button>
                <button onclick="filterCategory('fastfood')" id="cat-fastfood" 
                        class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">🍔 Fast Food</button>
                <button onclick="filterCategory('indian')" id="cat-indian" 
                        class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">🇮🇳 Indian</button>
                <button onclick="filterCategory('sweets')" id="cat-sweets" 
                        class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">🍬 Sweets</button>
                <button onclick="filterCategory('drinks')" id="cat-drinks" 
                        class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">🥤 Drinks</button>
            </div>

            <!-- Search -->
            <div class="relative mb-8">
                <input id="food-search" 
                       placeholder="Search biryani, dosa, gulab jamun, paneer..."
                       class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-3xl pl-14 py-4 text-base outline-none"
                       onkeyup="if(event.key==='Enter') filterFoods()">
                <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>

            <!-- Foods Grid - Optimized for Mobile -->
            <div id="foods-grid" class="foods-grid"></div>
        </div>

        <!-- ADD FOOD MODAL -->
        <div id="add-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-[100] p-4">
            <div onclick="event.stopImmediatePropagation()" 
                 class="modal bg-slate-900 w-full max-w-md rounded-3xl p-6">
                
                <h3 class="text-xl font-semibold mb-6 leading-tight" id="modal-food-name"></h3>
                
                <div class="mb-8">
                    <label class="block text-slate-400 text-sm mb-3">Servings</label>
                    <div class="flex items-center justify-center gap-6">
                        <button onclick="changeQuantity(-0.5)" 
                                class="w-12 h-12 bg-slate-800 rounded-2xl text-4xl flex items-center justify-center active:bg-slate-700">-</button>
                        <input id="modal-quantity" type="number" step="0.25" value="1" 
                               class="text-center text-5xl font-semibold bg-transparent w-24 outline-none">
                        <button onclick="changeQuantity(0.5)" 
                                class="w-12 h-12 bg-slate-800 rounded-2xl text-4xl flex items-center justify-center active:bg-slate-700">+</button>
                    </div>
                </div>

                <!-- Nutrition Values -->
                <div id="modal-nutrition" class="grid grid-cols-2 gap-4"></div>

                <div class="flex gap-3 mt-10">
                    <button onclick="hideAddModal()" 
                            class="flex-1 h-14 border border-slate-600 rounded-3xl font-medium">Cancel</button>
                    <button onclick="confirmAddToLog()" 
                            class="flex-1 h-14 bg-emerald-500 hover:bg-emerald-600 rounded-3xl font-medium text-white">Add to Log</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==================== FOOD DATABASE ====================
        let FOODS_DB = [
            { id: 100, name: "Big Mac", category: "fastfood", serving: "1 burger", calories: 540, protein: 25, carbs: 45, fat: 29 },
            { id: 101, name: "McAloo Tikki Burger", category: "fastfood", serving: "1 burger", calories: 340, protein: 8, carbs: 48, fat: 14 },
            { id: 102, name: "Zinger Burger", category: "fastfood", serving: "1 burger", calories: 450, protein: 20, carbs: 40, fat: 25 },
            { id: 103, name: "Vada Pav", category: "fastfood", serving: "1 piece", calories: 290, protein: 6, carbs: 35, fat: 14 },
            { id: 104, name: "Pav Bhaji", category: "fastfood", serving: "1 plate", calories: 450, protein: 10, carbs: 55, fat: 18 },
            { id: 105, name: "Hyderabadi Chicken Biryani", category: "indian", serving: "1 full plate", calories: 580, protein: 28, carbs: 65, fat: 22 },
            { id: 106, name: "Hyderabadi Veg Biryani", category: "indian", serving: "1 plate", calories: 420, protein: 12, carbs: 68, fat: 14 },
            { id: 107, name: "Butter Chicken", category: "indian", serving: "1 bowl", calories: 520, protein: 28, carbs: 25, fat: 32 },
            { id: 108, name: "Paneer Butter Masala", category: "indian", serving: "1 bowl", calories: 480, protein: 18, carbs: 22, fat: 35 },
            { id: 109, name: "Masala Dosa", category: "indian", serving: "1 piece", calories: 280, protein: 7, carbs: 48, fat: 8 },
            { id: 110, name: "Idli (2 pcs)", category: "indian", serving: "2 pieces", calories: 120, protein: 4, carbs: 24, fat: 1 },
            { id: 111, name: "Gulab Jamun (2 pcs)", category: "sweets", serving: "2 pieces", calories: 320, protein: 6, carbs: 48, fat: 12 },
            { id: 112, name: "Rasgulla (2 pcs)", category: "sweets", serving: "2 pieces", calories: 180, protein: 4, carbs: 38, fat: 1 },
            { id: 113, name: "Masala Chai", category: "drinks", serving: "1 cup", calories: 80, protein: 2, carbs: 10, fat: 4 },
            { id: 114, name: "Sweet Lassi", category: "drinks", serving: "1 glass", calories: 220, protein: 8, carbs: 28, fat: 8 },
            // Add more items from previous versions as needed...
        ];

        let customFoods = [];
        let currentAddFood = null;
        let currentQuantity = 1;
        let currentCategoryFilter = 'all';

        function loadData() {
            return [...FOODS_DB, ...customFoods];
        }

        function filterCategory(category) {
            currentCategoryFilter = category;
            document.querySelectorAll('#page-foods button').forEach(btn => {
                btn.classList.remove('bg-emerald-500', 'text-white');
                btn.classList.add('bg-slate-800');
            });
            document.getElementById(`cat-${category}`).classList.add('bg-emerald-500', 'text-white');
            filterFoods();
        }

        function filterFoods() {
            const allFoods = loadData();
            const query = document.getElementById('food-search').value.toLowerCase().trim();

            let filtered = allFoods;
            if (currentCategoryFilter !== 'all') {
                filtered = filtered.filter(f => f.category === currentCategoryFilter);
            }
            if (query) {
                filtered = filtered.filter(f => f.name.toLowerCase().includes(query));
            }
            renderFoods(filtered);
        }

        function renderFoods(foods) {
            const container = document.getElementById('foods-grid');
            container.innerHTML = '';

            if (foods.length === 0) {
                container.innerHTML = `<div class="col-span-full py-20 text-center text-slate-400">No foods found</div>`;
                return;
            }

            foods.forEach(food => {
                const card = document.createElement('div');
                card.className = `food-card bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden`;
                card.innerHTML = `
                    <div class="p-5">
                        <div class="flex justify-between items-start">
                            <div class="flex-1 pr-3">
                                <div class="font-semibold text-[17px] leading-tight">${food.name}</div>
                                <div class="text-xs text-slate-400 mt-1">${food.serving}</div>
                            </div>
                            <button onclick="event.stopImmediatePropagation(); addFoodToLogPrompt(${food.id});" 
                                    class="w-9 h-9 flex-shrink-0 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center text-2xl">＋</button>
                        </div>

                        <div class="nutrition-grid mt-6">
                            <div class="nutrition-item bg-slate-800/70 rounded-2xl p-3 text-center">
                                <div class="text-emerald-400 text-2xl font-semibold">${food.calories}</div>
                                <div class="text-[10px] uppercase tracking-widest text-slate-400 mt-0.5">kcal</div>
                            </div>
                            <div class="nutrition-item bg-slate-800/70 rounded-2xl p-3 text-center">
                                <div class="text-emerald-400 text-2xl font-semibold">${food.protein}</div>
                                <div class="text-[10px] uppercase tracking-widest text-slate-400 mt-0.5">protein</div>
                            </div>
                            <div class="nutrition-item bg-slate-800/70 rounded-2xl p-3 text-center">
                                <div class="text-emerald-400 text-2xl font-semibold">${food.carbs}</div>
                                <div class="text-[10px] uppercase tracking-widest text-slate-400 mt-0.5">carbs</div>
                            </div>
                            <div class="nutrition-item bg-slate-800/70 rounded-2xl p-3 text-center">
                                <div class="text-emerald-400 text-2xl font-semibold">${food.fat}</div>
                                <div class="text-[10px] uppercase tracking-widest text-slate-400 mt-0.5">fat</div>
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addFoodToLogPrompt(id) {
            const allFoods = loadData();
            currentAddFood = allFoods.find(f => f.id === id);
            if (!currentAddFood) return;

            currentQuantity = 1;
            document.getElementById('modal-food-name').textContent = currentAddFood.name;
            updateModalNutrition();
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        }

        function updateModalNutrition() {
            if (!currentAddFood) return;
            const qty = currentQuantity;
            const html = `
                <div class="bg-slate-800 rounded-2xl p-4 text-center">
                    <div class="text-xs text-slate-400 mb-1">CALORIES</div>
                    <div class="text-3xl font-semibold text-emerald-400">${Math.round(currentAddFood.calories * qty)}</div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-4 text-center">
                    <div class="text-xs text-slate-400 mb-1">PROTEIN</div>
                    <div class="text-3xl font-semibold">${(currentAddFood.protein * qty).toFixed(1)}g</div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-4 text-center">
                    <div class="text-xs text-slate-400 mb-1">CARBS</div>
                    <div class="text-3xl font-semibold">${(currentAddFood.carbs * qty).toFixed(1)}g</div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-4 text-center">
                    <div class="text-xs text-slate-400 mb-1">FAT</div>
                    <div class="text-3xl font-semibold">${(currentAddFood.fat * qty).toFixed(1)}g</div>
                </div>
            `;
            document.getElementById('modal-nutrition').innerHTML = html;
        }

        function changeQuantity(delta) {
            currentQuantity = Math.max(0.25, currentQuantity + delta);
            updateModalNutrition();
        }

        function hideAddModal() {
            const modal = document.getElementById('add-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function confirmAddToLog() {
            if (!currentAddFood) return;
            hideAddModal();
            showToast(`${currentQuantity}× ${currentAddFood.name} added to log`);
        }

        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            document.getElementById(`page-${page}`).classList.remove('hidden');
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.style.cssText = `position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 14px 24px; border-radius: 9999px; font-size: 15px; box-shadow: 0 10px 15px -3px rgb(16 185 129); z-index: 9999;`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2200);
        }

        function showDateInfo() {
            alert("Today is " + new Date().toLocaleDateString('en-IN', { weekday: 'long', month: 'long', day: 'numeric' }));
        }

        function initApp() {
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-IN', {weekday:'short', month:'short', day:'numeric'});
            navigateTo('foods');
            filterFoods(); // initial render
            console.log("%c✅ Mobile card spacing optimized for small devices", "color:#10b981");
        }

        window.onload = initApp;
    </script>
</body>
</html>
