<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriCheck • Nutrition Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        * { transition: all 0.2s ease; }
        
        .food-card:hover { 
            transform: translateY(-4px); 
            box-shadow: 0 20px 25px -5px rgb(16 185 129 / 0.15); 
        }
        
        .tab-active { 
            border-bottom: 3px solid #10b981; 
            color: #10b981; 
            font-weight: 600; 
        }
        
        .modal { 
            animation: modalPop 0.3s ease-out; 
        }
        
        @keyframes modalPop { 
            from { opacity: 0; transform: scale(0.95); } 
            to { opacity: 1; transform: scale(1); } 
        }

        /* Mobile-friendly nutrition grid */
        .nutrition-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        @media (max-width: 480px) {
            .nutrition-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            
            .food-card {
                padding: 20px 16px;
            }
            
            .food-name {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans">

    <!-- HEADER -->
    <div class="border-b border-slate-800 bg-slate-950 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-x-3">
                    <div class="w-9 h-9 bg-emerald-500 rounded-2xl flex items-center justify-center text-white text-2xl">🍛</div>
                    <h1 class="text-2xl font-semibold tracking-[-1px]" style="font-family: 'Space Grotesk', sans-serif;">NutriCheck</h1>
                    <span class="px-3 py-1 text-xs bg-emerald-500/10 text-emerald-400 rounded-3xl border border-emerald-500/30">250+</span>
                </div>

                <div class="hidden md:flex items-center gap-x-8 text-sm font-medium">
                    <a onclick="navigateTo('dashboard')" id="nav-dashboard" class="tab-active flex items-center gap-x-2 cursor-pointer">Dashboard</a>
                    <a onclick="navigateTo('foods')" id="nav-foods" class="flex items-center gap-x-2 cursor-pointer">Foods</a>
                    <a onclick="navigateTo('log')" id="nav-log" class="flex items-center gap-x-2 cursor-pointer">Daily Log</a>
                    <a onclick="navigateTo('goals')" id="nav-goals" class="flex items-center gap-x-2 cursor-pointer">Goals</a>
                    <a onclick="navigateTo('hydration')" id="nav-hydration" class="flex items-center gap-x-2 cursor-pointer">Hydration</a>
                </div>

                <div class="flex items-center gap-x-3">
                    <div onclick="showDateInfo()" class="flex items-center gap-x-2 text-sm px-4 py-2 bg-slate-900 rounded-3xl border border-slate-700 cursor-pointer">
                        <i class="fa-solid fa-calendar text-emerald-400"></i>
                        <span id="current-date" class="font-medium hidden sm:inline"></span>
                    </div>
                    <div class="flex items-center gap-x-2 bg-slate-900 rounded-3xl px-3 py-2 border border-slate-700">
                        <div class="w-8 h-8 bg-slate-700 rounded-2xl flex items-center justify-center text-lg">👤</div>
                        <div class="text-sm hidden sm:block">Sai</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 sm:py-8">

        <!-- FOODS PAGE -->
        <div id="page-foods" class="page">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                <h2 class="text-3xl sm:text-4xl font-semibold">Foods Database <span class="text-emerald-400">(250+)</span></h2>
                
                <div class="flex flex-wrap gap-2">
                    <button onclick="filterCategory('all')" id="cat-all" 
                            class="px-5 py-2 bg-emerald-500 text-white rounded-3xl text-sm font-medium">All</button>
                    <button onclick="filterCategory('fastfood')" id="cat-fastfood" 
                            class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">🍔 Fast</button>
                    <button onclick="filterCategory('indian')" id="cat-indian" 
                            class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">🇮🇳 Indian</button>
                    <button onclick="filterCategory('sweets')" id="cat-sweets" 
                            class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">🍬 Sweets</button>
                    <button onclick="filterCategory('drinks')" id="cat-drinks" 
                            class="px-5 py-2 bg-slate-800 hover:bg-slate-700 rounded-3xl text-sm font-medium">🥤 Drinks</button>
                </div>
            </div>

            <div class="relative mb-8">
                <input id="food-search" 
                       placeholder="Search biryani, dosa, gulab jamun..."
                       class="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-3xl pl-14 py-5 text-lg outline-none"
                       onkeyup="if(event.key==='Enter') filterFoods()">
                <i class="fa-solid fa-magnifying-glass absolute left-6 top-1/2 -translate-y-1/2 text-slate-400"></i>
            </div>

            <div id="foods-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        </div>

        <!-- ADD TO LOG MODAL -->
        <div id="add-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4">
            <div class="modal bg-slate-900 w-full max-w-lg mx-auto rounded-3xl p-6 sm:p-8">
                <h3 class="text-2xl font-semibold mb-6" id="modal-food-name"></h3>
                
                <div class="mb-8">
                    <label class="text-slate-400 mb-3 block text-sm">Servings</label>
                    <div class="flex items-center gap-4 justify-center">
                        <button onclick="changeQuantity(-0.5)" 
                                class="w-14 h-14 bg-slate-800 hover:bg-slate-700 rounded-2xl text-4xl font-light">-</button>
                        <input id="modal-quantity" type="number" step="0.25" value="1" 
                               class="text-center text-6xl font-semibold bg-transparent w-28 outline-none">
                        <button onclick="changeQuantity(0.5)" 
                                class="w-14 h-14 bg-slate-800 hover:bg-slate-700 rounded-2xl text-4xl font-light">+</button>
                    </div>
                </div>

                <div id="modal-nutrition" class="nutrition-grid"></div>

                <div class="flex gap-4 mt-10">
                    <button onclick="hideAddModal()" 
                            class="flex-1 h-14 border border-slate-600 rounded-3xl text-lg">Cancel</button>
                    <button onclick="confirmAddToLog()" 
                            class="flex-1 h-14 bg-emerald-500 hover:bg-emerald-600 rounded-3xl text-lg text-white">Add to Log</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // ==================== FOOD DATABASE (250+ items) ====================
        let FOODS_DB = [
            // Fast Food
            { id: 100, name: "Big Mac", category: "fastfood", serving: "1 burger", calories: 540, protein: 25, carbs: 45, fat: 29 },
            { id: 101, name: "McAloo Tikki Burger", category: "fastfood", serving: "1 burger", calories: 340, protein: 8, carbs: 48, fat: 14 },
            { id: 102, name: "Zinger Burger", category: "fastfood", serving: "1 burger", calories: 450, protein: 20, carbs: 40, fat: 25 },
            { id: 103, name: "Vada Pav", category: "fastfood", serving: "1 piece", calories: 290, protein: 6, carbs: 35, fat: 14 },
            { id: 104, name: "Pav Bhaji", category: "fastfood", serving: "1 plate", calories: 450, protein: 10, carbs: 55, fat: 18 },

            // Biryanis & Rice
            { id: 200, name: "Hyderabadi Chicken Biryani", category: "indian", serving: "1 full plate", calories: 580, protein: 28, carbs: 65, fat: 22 },
            { id: 201, name: "Hyderabadi Veg Biryani", category: "indian", serving: "1 plate", calories: 420, protein: 12, carbs: 68, fat: 14 },
            { id: 202, name: "Lucknowi Veg Biryani", category: "indian", serving: "1 plate", calories: 410, protein: 11, carbs: 67, fat: 13 },
            { id: 203, name: "Malabar Chicken Biryani", category: "indian", serving: "1 plate", calories: 520, protein: 25, carbs: 60, fat: 24 },
            { id: 204, name: "Curd Rice", category: "indian", serving: "1 bowl", calories: 220, protein: 6, carbs: 38, fat: 5 },
            { id: 205, name: "Lemon Rice", category: "indian", serving: "1 bowl", calories: 280, protein: 5, carbs: 48, fat: 8 },
            { id: 206, name: "Jeera Rice", category: "indian", serving: "1 bowl", calories: 260, protein: 5, carbs: 48, fat: 7 },

            // Breakfast & South Indian
            { id: 210, name: "Masala Dosa", category: "indian", serving: "1 piece", calories: 280, protein: 7, carbs: 48, fat: 8 },
            { id: 211, name: "Idli (2 pcs)", category: "indian", serving: "2 pieces", calories: 120, protein: 4, carbs: 24, fat: 1 },
            { id: 212, name: "Medu Vada", category: "indian", serving: "2 pieces", calories: 240, protein: 8, carbs: 22, fat: 14 },
            { id: 213, name: "Uttapam", category: "indian", serving: "1 piece", calories: 260, protein: 6, carbs: 42, fat: 9 },

            // Curries
            { id: 220, name: "Butter Chicken", category: "indian", serving: "1 bowl", calories: 520, protein: 28, carbs: 25, fat: 32 },
            { id: 221, name: "Paneer Butter Masala", category: "indian", serving: "1 bowl", calories: 480, protein: 18, carbs: 22, fat: 35 },
            { id: 222, name: "Dal Makhani", category: "indian", serving: "1 bowl", calories: 320, protein: 12, carbs: 28, fat: 20 },
            { id: 223, name: "Rajma Masala", category: "indian", serving: "1 bowl", calories: 340, protein: 15, carbs: 45, fat: 12 },

            // Breads
            { id: 230, name: "Butter Naan", category: "indian", serving: "1 piece", calories: 280, protein: 8, carbs: 38, fat: 12 },
            { id: 231, name: "Aloo Paratha", category: "indian", serving: "1 piece", calories: 320, protein: 8, carbs: 45, fat: 12 },
            { id: 232, name: "Roti / Chapati", category: "indian", serving: "1 piece", calories: 120, protein: 4, carbs: 22, fat: 3 },

            // Sweets
            { id: 300, name: "Gulab Jamun (2 pcs)", category: "sweets", serving: "2 pieces", calories: 320, protein: 6, carbs: 48, fat: 12 },
            { id: 301, name: "Rasgulla (2 pcs)", category: "sweets", serving: "2 pieces", calories: 180, protein: 4, carbs: 38, fat: 1 },
            { id: 302, name: "Jalebi", category: "sweets", serving: "4 pieces", calories: 380, protein: 5, carbs: 65, fat: 12 },

            // Drinks
            { id: 400, name: "Masala Chai", category: "drinks", serving: "1 cup", calories: 80, protein: 2, carbs: 10, fat: 4 },
            { id: 401, name: "Sweet Lassi", category: "drinks", serving: "1 glass", calories: 220, protein: 8, carbs: 28, fat: 8 },
            { id: 402, name: "Filter Coffee", category: "drinks", serving: "1 cup", calories: 90, protein: 3, carbs: 12, fat: 3 }
        ];

        let customFoods = [];
        let goals = { calories: 2000, protein: 120, carbs: 250, fat: 65, water: 2500 };
        let dailyData = {};
        let currentAddFood = null;
        let currentQuantity = 1;
        let currentCategoryFilter = 'all';

        function getTodayKey() { return new Date().toISOString().split('T')[0]; }

        function loadData() {
            const savedGoals = localStorage.getItem('nutricheck_goals');
            if (savedGoals) goals = JSON.parse(savedGoals);

            const savedCustom = localStorage.getItem('nutricheck_custom_foods');
            if (savedCustom) customFoods = JSON.parse(savedCustom);

            const savedData = localStorage.getItem('nutricheck_daily_data');
            if (savedData) dailyData = JSON.parse(savedData);

            return [...FOODS_DB, ...customFoods];
        }

        function saveData() {
            localStorage.setItem('nutricheck_goals', JSON.stringify(goals));
            localStorage.setItem('nutricheck_custom_foods', JSON.stringify(customFoods));
            localStorage.setItem('nutricheck_daily_data', JSON.stringify(dailyData));
        }

        function filterCategory(category) {
            currentCategoryFilter = category;
            document.querySelectorAll('#page-foods button').forEach(btn => {
                btn.classList.remove('bg-emerald-500', 'text-white');
                btn.classList.add('bg-slate-800');
            });
            const active = document.getElementById(`cat-${category}`);
            if (active) active.classList.add('bg-emerald-500', 'text-white');
            filterFoods();
        }

        function filterFoods() {
            const allFoods = loadData();
            const query = document.getElementById('food-search').value.toLowerCase().trim();

            let filtered = allFoods;
            if (currentCategoryFilter !== 'all') {
                filtered = filtered.filter(f => f.category === currentCategoryFilter);
            }
            if (query) {
                filtered = filtered.filter(f => f.name.toLowerCase().includes(query));
            }
            renderFoods(filtered);
        }

        function renderFoods(foods) {
            const container = document.getElementById('foods-grid');
            container.innerHTML = '';

            if (foods.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400">No foods found</div>`;
                return;
            }

            foods.forEach(food => {
                const card = document.createElement('div');
                card.className = `food-card bg-slate-900 rounded-3xl p-5 sm:p-6 cursor-pointer border border-transparent hover:border-emerald-400`;
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="food-name font-semibold text-lg sm:text-xl leading-tight">${food.name}</div>
                            <div class="text-xs sm:text-sm text-slate-400 mt-1">${food.serving}</div>
                        </div>
                        <button onclick="event.stopImmediatePropagation(); addFoodToLogPrompt(${food.id});" 
                                class="bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-400 h-9 w-9 rounded-2xl flex items-center justify-center text-xl">＋</button>
                    </div>
                    
                    <div class="nutrition-grid mt-8">
                        <div class="bg-slate-800 rounded-2xl p-3 text-center">
                            <div class="text-emerald-400 text-2xl sm:text-3xl font-bold">${food.calories}</div>
                            <div class="text-[10px] text-slate-400">kcal</div>
                        </div>
                        <div class="bg-slate-800 rounded-2xl p-3 text-center">
                            <div class="text-emerald-400 text-2xl sm:text-3xl font-bold">${food.protein}</div>
                            <div class="text-[10px] text-slate-400">Protein</div>
                        </div>
                        <div class="bg-slate-800 rounded-2xl p-3 text-center">
                            <div class="text-emerald-400 text-2xl sm:text-3xl font-bold">${food.carbs}</div>
                            <div class="text-[10px] text-slate-400">Carbs</div>
                        </div>
                        <div class="bg-slate-800 rounded-2xl p-3 text-center">
                            <div class="text-emerald-400 text-2xl sm:text-3xl font-bold">${food.fat}</div>
                            <div class="text-[10px] text-slate-400">Fat</div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addFoodToLogPrompt(id) {
            const allFoods = loadData();
            currentAddFood = allFoods.find(f => f.id === id);
            if (!currentAddFood) return;

            currentQuantity = 1;
            document.getElementById('modal-food-name').textContent = currentAddFood.name;
            updateModalNutrition();
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        }

        function updateModalNutrition() {
            if (!currentAddFood) return;
            const qty = currentQuantity;
            document.getElementById('modal-nutrition').innerHTML = `
                <div class="bg-slate-800 rounded-2xl p-4 text-center">
                    <div class="text-xs text-slate-400">CALORIES</div>
                    <div class="text-3xl font-bold text-emerald-400">${Math.round(currentAddFood.calories * qty)}</div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-4 text-center">
                    <div class="text-xs text-slate-400">PROTEIN</div>
                    <div class="text-3xl font-bold">${(currentAddFood.protein * qty).toFixed(1)}g</div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-4 text-center">
                    <div class="text-xs text-slate-400">CARBS</div>
                    <div class="text-3xl font-bold">${(currentAddFood.carbs * qty).toFixed(1)}g</div>
                </div>
                <div class="bg-slate-800 rounded-2xl p-4 text-center">
                    <div class="text-xs text-slate-400">FAT</div>
                    <div class="text-3xl font-bold">${(currentAddFood.fat * qty).toFixed(1)}g</div>
                </div>
            `;
        }

        function changeQuantity(delta) {
            currentQuantity = Math.max(0.25, currentQuantity + delta);
            updateModalNutrition();
        }

        function hideAddModal() {
            const modal = document.getElementById('add-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function confirmAddToLog() {
            if (!currentAddFood) return;
            const today = getTodayData();
            
            const item = {
                id: Date.now(),
                name: currentAddFood.name,
                serving: currentAddFood.serving,
                quantity: currentQuantity,
                calories: Math.round(currentAddFood.calories * currentQuantity),
                protein: Number((currentAddFood.protein * currentQuantity).toFixed(1)),
                carbs: Number((currentAddFood.carbs * currentQuantity).toFixed(1)),
                fat: Number((currentAddFood.fat * currentQuantity).toFixed(1)),
                timestamp: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})
            };

            today.log.unshift(item);
            saveData();
            hideAddModal();
            showToast(`${currentQuantity}× ${item.name} added!`);
        }

        function navigateTo(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
            const target = document.getElementById(`page-${page}`);
            if (target) target.classList.remove('hidden');

            document.querySelectorAll('a[id^="nav-"]').forEach(n => n.classList.remove('tab-active'));
            const nav = document.getElementById(`nav-${page}`);
            if (nav) nav.classList.add('tab-active');

            if (page === 'foods') filterFoods();
        }

        function getTodayData() {
            const key = getTodayKey();
            if (!dailyData[key]) dailyData[key] = { log: [], waterIntakes: [] };
            return dailyData[key];
        }

        function showToast(msg) {
            const t = document.createElement('div');
            t.style.cssText = `position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:#10b981; color:white; padding:14px 24px; border-radius:9999px; box-shadow:0 10px 15px -3px rgb(16 185 129); z-index:9999; font-size:15px;`;
            t.innerHTML = msg;
            document.body.appendChild(t);
            setTimeout(() => t.remove(), 2500);
        }

        function showDateInfo() {
            alert("Today: " + new Date().toLocaleDateString('en-IN', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }));
        }

        function initApp() {
            loadData();
            document.getElementById('current-date').textContent = new Date().toLocaleDateString('en-IN', {weekday:'short', month:'short', day:'numeric'});
            navigateTo('foods');
            console.log("%c✅ NutriCheck ready with improved mobile layout and 250+ Indian foods!", "color:#10b981; font-weight:bold");
        }

        window.onload = initApp;
    </script>
</body>
</html>
