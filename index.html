<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .card {
      transition: all 0.3s ease;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="max-w-md w-full">
    <!-- Main Card -->
    <div class="bg-white rounded-3xl shadow-2xl overflow-hidden card">
      
      <!-- Header -->
      <div class="p-8 text-center border-b">
        <h1 class="text-3xl font-bold text-gray-800">Welcome</h1>
        <p class="text-gray-500 mt-2" id="form-title">Sign in to continue</p>
      </div>

      <!-- Form Container -->
      <div class="p-8">
        <!-- Login Form -->
        <form id="login-form" class="space-y-6">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="login-email" 
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-purple-500"
                   placeholder="your@email.com" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="login-password" 
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-purple-500"
                   placeholder="••••••••" required>
          </div>
          <div class="flex items-center justify-between text-sm">
            <label class="flex items-center">
              <input type="checkbox" class="w-4 h-4 text-purple-600 rounded">
              <span class="ml-2 text-gray-600">Remember me</span>
            </label>
            <a href="#" class="text-purple-600 hover:underline">Forgot password?</a>
          </div>
          <button type="submit"
                  class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3.5 rounded-2xl font-semibold transition">
            Sign In
          </button>
        </form>

        <!-- Signup Form -->
        <form id="signup-form" class="space-y-6 hidden">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
            <input type="text" id="signup-name" 
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-purple-500"
                   placeholder="John Doe" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input type="email" id="signup-email" 
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-purple-500"
                   placeholder="your@email.com" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="signup-password" 
                   class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:border-purple-500"
                   placeholder="Create password" required>
          </div>
          <button type="submit"
                  class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3.5 rounded-2xl font-semibold transition">
            Create Account
          </button>
        </form>
      </div>

      <!-- Toggle -->
      <div class="px-8 py-6 bg-gray-50 border-t text-center">
        <p class="text-gray-600" id="toggle-text">
          Don't have an account? 
          <span onclick="toggleForms()" class="text-purple-600 font-semibold cursor-pointer hover:underline">Sign up</span>
        </p>
      </div>
    </div>

    <p class="text-center text-white/70 text-sm mt-6">
      © 2026 Your Company
    </p>
  </div>

  <script>
    let isLogin = true;

    function toggleForms() {
      const loginForm = document.getElementById('login-form');
      const signupForm = document.getElementById('signup-form');
      const title = document.getElementById('form-title');
      const toggleText = document.getElementById('toggle-text');

      isLogin = !isLogin;

      if (isLogin) {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        title.textContent = "Sign in to continue";
        toggleText.innerHTML = `Don't have an account? <span onclick="toggleForms()" class="text-purple-600 font-semibold cursor-pointer hover:underline">Sign up</span>`;
      } else {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        title.textContent = "Create your account";
        toggleText.innerHTML = `Already have an account? <span onclick="toggleForms()" class="text-purple-600 font-semibold cursor-pointer hover:underline">Sign in</span>`;
      }
    }

    // Form Submissions
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      alert(`Login successful for: ${email}\n(Backend integration needed)`);
    });

    document.getElementById('signup-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('signup-name').value;
      const email = document.getElementById('signup-email').value;
      alert(`Account created for ${name} (${email})\n(Backend integration needed)`);
    });
  </script>
</body>
</html>
